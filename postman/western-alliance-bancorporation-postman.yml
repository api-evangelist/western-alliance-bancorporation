note: Western Alliance Bank publishes one Postman v2.1 collection per API product on its WAB API Developer Portal
  (Salesforce Experience Cloud CMS). The portal pages are JS-rendered and the CMS document pages answer with an
  SPA shell, but the underlying files are served anonymously by the Salesforce CMS delivery endpoint /sfsites/c/cms/delivery/media/<id>,
  discovered through the portal sitemap (https://developer.westernalliancebank.com/s/sitemap-managedcontent-cms_document-1.xml).
  Each collection was fetched verbatim (200, application/json) and is the source the openapi/ specs were mechanically
  derived from. The two beta collections carry the provider's own published example AppClientId/AppClientSecret
  values for the UAT host; 0-working/sanitize-secrets.py found no secret-shaped tokens and the files are kept verbatim
  as the provider serves them. The Intrabank Transfer API has no collection - its user guide PDF is saved alongside.
workspace_style: portal-hosted files (no public postman.com workspace; https://www.postman.com/westernalliancebank
  answers a generic Postman page)
