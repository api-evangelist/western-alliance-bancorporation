description: >-
  No numeric rate limits, quotas or rate-limit response headers are published. API Services Terms 6(d) reserve the
  right to restrict "the number, frequency, and currency amount and/or volume of access requests"; limits "may be
  identified in communications of WAB's approval of Company's access" and are subject to change at any time, and the
  client must not exceed "reasonable request volume". Tokens are valid for a limited period (6(c)(iii)); the
  lifetime is not published.
