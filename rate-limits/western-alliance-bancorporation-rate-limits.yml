notes: >-
  Replaces the 2026-05-04 scaffold. None of the 15 published Postman collections shows an X-RateLimit-*,
  RateLimit-* or Retry-After header, and no 429 example is documented anywhere; the 429 entry below is the
  scaffold's assumption retained as unverified.
responseCodes:
  throttled: 429
  throttled_note: not documented by the provider - assumed HTTP default, unverified
headers: []
limits: []
policies:
  - name: Contract-communicated limits
    description: >-
      Per-client limits (request count, frequency, currency amount and volume) are set at approval time and
      communicated directly to the enrolled company; they are not published and can change without notice.
  - name: Token lifetime
    description: Bearer tokens from /entitlements-get-token-eapi/api/v1/token expire after an unpublished period; clients must refresh.
