note: Upgraded from the API Services Terms & Conditions (v6, May 14 2025) and the provider Token API Postman collection.
  Enrollment through Treasury Management issues a Client ID and Client Secret (Terms 1(j)/(k), 6(c)(i)); the client
  sends them as the appClientId / appClientSecret headers to GET /entitlements-get-token-eapi/api/v1/token?Scope=<Informational|...>
  and receives a bearer token "valid for a limited period of time" (Terms 6(c)(iii)); every API call must be signed
  with that token. Funds-transfer clients also install a WAB-issued Client Certificate on approved servers (Terms
  1(i), 6(c)(ii)) - a mutual-TLS control the Postman collections cannot show. The TassatPay beta adds a second credential
  layer (Tassat client_id/client_secret -> access_token, then a user_token per wallet user). Multi-factor procedures
  may be required (Terms 7). The developer.westernalliancebank.com openid-configuration is the Salesforce portal
  login IdP, not the API auth server.
flow:
- step: 1
  action: Enroll in Treasury Management API services; WAB issues Client ID + Client Secret (and a Client Certificate
    for funds-transfer products).
- step: 2
  action: GET https://api-connect.westernalliancebank.com/entitlements-get-token-eapi/api/v1/token?Scope=Informational
    with headers appClientId, appClientSecret, X-Correlation-ID (GUID).
  operationId: getToken
- step: 3
  action: 'Send Authorization: Bearer <token> plus X-Correlation-ID on every product API call; refresh the token
    when it expires (lifetime not published).'
scopes:
  style: query parameter Scope on the token endpoint
  documented_values:
  - Informational
  note: Only "Informational" appears in the published collections; the Transactional and Digital Assets collections
    request the same scope value. No scope reference page is published anonymously.
