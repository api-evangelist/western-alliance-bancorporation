description: >-
  Western Alliance Bank does not sell API access as a priced product. The API Services Terms & Conditions (v6, May 14
  2025) state in section 11 "No Fees" that no license fees or other payments are due for the API rights themselves;
  WAB "may charge service fees, in accordance with its standard schedule of fees and charges, related to the
  underlying transactions and activities" (the Business Banking and Related Services Schedule of Fees and Charges,
  section 4). Access is granted through Treasury Management enrollment and a Setup Form; the developer portal has
  self-registration but the API products require approval.
