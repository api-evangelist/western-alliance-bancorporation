plans:
  - id: western-alliance-bancorporation-treasury-management-api
    name: Treasury Management API Services
    type: enterprise
    description: >-
      Royalty-free, limited, revocable, non-exclusive licence to the API and API Products for enrolled Treasury
      Management clients (Terms 3(a)). No API licence fee; per-transaction service fees per the bank's standard
      schedule. Products are selected on the Setup Form (Informational, Transactional, Utility, Embedded Finance,
      Digital Assets, Corporate Trust families).
